name: pontalti-whatsapp-test
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: pontalti-local-test
      POSTGRES_DB: pontalti_whatsapp_test
    ports:
      - "127.0.0.1:55439:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pontalti_whatsapp_test"]
      interval: 2s
      timeout: 2s
      retries: 20
  rest:
    image: postgrest/postgrest:v13.0.7
    environment:
      PGRST_DB_URI: postgres://authenticator:pontalti-local-test@db:5432/pontalti_whatsapp_test
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: pontalti-whatsapp-local-test-secret-with-32-characters
    depends_on:
      db:
        condition: service_healthy
  api:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "127.0.0.1:55440:80"
    depends_on:
      - rest
